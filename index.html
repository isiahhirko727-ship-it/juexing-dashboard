<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>觉醒 · 只工作不上班 | 项目看板</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* 火焰主色（原 green 变量复用为火热橙红，绿=正常 仍用硬编码 #22c55e 保留语义） */
      --green-900: #5c0a0a;
      --green-800: #9b1c1c;
      --green-700: #c0392b;
      --green-600: #ff4d2e;
      --green-500: #ff6b35;
      --green-100: #fff1e8;
      --green-50:  #fdf3ee;
      --amber: #ff8c00;
      --red: #ef4444;
      --blue: #3b82f6;
      --gold-500: #ffb020;
      --gold-400: #ffd60a;
      --flame: linear-gradient(135deg, #ff4d2e 0%, #ff8c00 100%);
      --flame-deep: linear-gradient(135deg, #4a0808 0%, #e2371f 100%);
      --gold-grad: linear-gradient(135deg, #ffd60a 0%, #ff8c00 100%);
      --gray-900: #1c1410;
      --gray-700: #4a4038;
      --gray-500: #8a7d72;
      --gray-300: #e9ddd2;
      --gray-200: #efe4d8;
      --gray-100: #f7efe7;
      --white: #ffffff;
      --bg: #fdf3ec;
      --radius: 14px;
      --shadow: 0 6px 22px rgba(220, 70, 30, 0.10);
      --shadow-hover: 0 12px 32px rgba(220, 70, 30, 0.18);
      --glow-fire: 0 0 16px rgba(255, 90, 40, 0.45);
      --glow-gold: 0 0 16px rgba(255, 176, 32, 0.5);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--gray-900); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      background: var(--flame-deep); color: #fff; box-shadow: 0 4px 22px rgba(220,60,30,.35);
      padding: 12px 28px; display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 42px; height: 42px; border-radius: 10px; background: var(--white); color: var(--green-900);
      display: grid; place-items: center; font-weight: 800; font-size: 18px;
    }
    .brand-title { font-size: 18px; font-weight: 700; }
    .brand-sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }
    .update-time { font-size: 13px; opacity: 0.85; }
    .nav-tabs {
      background: var(--white); border-bottom: 1px solid var(--gray-100);
      padding: 0 28px; display: flex; gap: 0; position: sticky; top: 0; z-index: 50;
    }
    .nav-tab {
      padding: 16px 26px; font-size: 15px; font-weight: 500; color: var(--gray-700);
      cursor: pointer; border-bottom: 3px solid transparent; transition: .2s;
    }
    .nav-tab:hover { color: var(--green-700); }
    .nav-tab.active { color: var(--green-600); border-bottom-color: var(--green-600); font-weight: 800; text-shadow: 0 0 12px rgba(255,90,40,.3); }
    .container { padding: 16px 28px 18px; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .section { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .section.hidden { display: none; }
    .section-body { padding: 16px 24px; flex: 1; min-height: 0; overflow: auto; }

    /* Section 1: People */
    .people-layout { display: grid; grid-template-columns: 1fr 360px; gap: 22px; align-items: stretch; }
    .people-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .people-card {
      background: var(--green-50); border-radius: 12px; padding: 18px;
      border: 1px solid #ffd9c2; position: relative;
    }
    .people-card.temporary { border-color: #fde68a; background: #fffbeb; }
    .people-badge {
      position: absolute; top: 12px; right: 12px; font-size: 11px;
      background: #fde68a; color: #92400e; padding: 3px 8px; border-radius: 999px;
    }
    .people-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .people-icon { font-size: 26px; }
    .people-name { font-size: 18px; font-weight: 800; color: var(--gray-900); letter-spacing: 0.3px; }
    .people-row { display: flex; gap: 14px; margin-bottom: 12px; }
    .people-metrics { display: flex; gap: 12px; margin-bottom: 12px; align-items: stretch; }
    .people-hero {
      flex: 1.6; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
      border-radius: 10px; padding: 12px 8px;
      background: linear-gradient(135deg, #fff1e6 0%, #ffe0c7 100%);
      border: 1px solid #ffc4a3;
      box-shadow: 0 0 0 1px rgba(255,107,53,0.18), 0 6px 18px rgba(255,107,53,0.16);
    }
    .people-hero .people-metric-label { font-size: 11px; color: #c2410c; font-weight: 700; margin-bottom: 2px; letter-spacing: 0.5px; }
    .people-hero .people-metric-value { font-size: 34px; font-weight: 900; color: var(--green-600); letter-spacing: -1px; line-height: 1.1; text-shadow: 0 1px 0 rgba(255,255,255,0.5); }
    .people-hero .people-metric-value.missing { font-size: 16px; color: var(--gray-400); font-weight: 600; letter-spacing: 0; text-shadow: none; }
    .people-deltas { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .people-delta { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: rgba(255,255,255,0.65); border-radius: 8px; padding: 6px 4px; }
    .people-delta-label { font-size: 10px; color: var(--gray-500); margin-bottom: 2px; }
    .people-delta-val { font-size: 16px; font-weight: 700; color: var(--amber); }
    .people-delta-val.zero { color: var(--gray-400); font-weight: 500; }
    .people-channels { margin-top: 10px; }
    .people-channel-title { font-size: 12px; color: var(--gray-500); margin-bottom: 6px; }
    .channel-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .channel-tag {
      font-size: 11px; padding: 4px 10px; border-radius: 999px;
      background: var(--white); color: var(--gray-700); border: 1px solid var(--gray-200);
    }
    .channel-tag.missing { color: var(--gray-400); background: transparent; }
    .people-charts { display: flex; flex-direction: column; gap: 18px; align-items: stretch; }
    .chart-card {
      flex: 1; min-height: 0;
      background: linear-gradient(180deg, #fff6ef 0%, #ffecdc 100%);
      border: 1px solid #ffd2b8; border-radius: 12px; padding: 14px 18px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; box-shadow: 0 4px 18px rgba(255,107,53,.16);
    }
    .chart-title { font-size: 14px; font-weight: 800; color: #7a2e12; margin-bottom: 8px; }
    .pie-chart { width: 160px; height: 160px; margin: 0 auto; }
    .pie-center { fill: var(--gray-50); font-size: 11px; text-anchor: middle; dominant-baseline: middle; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--gray-600); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    .note { font-size: 12px; color: var(--gray-500); margin-top: 14px; padding: 10px; background: var(--gray-50); border-radius: 8px; }
    .missing-note { color: var(--amber); }

    /* Section 2: Projects - layout */
    .projects-layout { display: flex; gap: 18px; align-items: stretch; flex: 1; min-height: 0; }
    .projects-left { flex: 1; min-width: 0; min-height: 0; }
    .projects-comp { flex: 0 0 250px; background: linear-gradient(180deg, #fff6ef 0%, #ffecdc 100%); border: 1px solid #ffd2b8; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 12px; min-height: 0; margin-top: 26px; align-self: stretch; }
    .comp-card { flex: 1; min-height: 0; background: linear-gradient(180deg,#fffaf5,#fff1e8); border: 1px solid #ffe0cc; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; align-items: center; overflow: auto; box-shadow: 0 4px 16px rgba(255,107,53,.12); }
    .comp-title { font-size: 14px; font-weight: 800; color: #7a2e12; align-self: flex-start; margin-bottom: 4px; }
    .comp-note { font-size: 11px; color: var(--gray-500); align-self: flex-start; margin-top: 6px; line-height: 1.4; }
    .comp-card .pie-chart { width: 132px; height: 132px; margin: 2px auto 0; }
    .projects-right { flex: 0 0 220px; width: 220px; }
    .project-extra { margin: 10px 0 2px; }
    .project-positioning { font-size: 11px; color: var(--gray-500); line-height: 1.45; margin-bottom: 7px; }
    .project-metrics { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; }
    .metric-chip { font-size: 11px; background: var(--gray-100); color: var(--gray-700); padding: 3px 9px; border-radius: 7px; white-space: nowrap; }
    .project-channels { font-size: 11px; color: var(--gray-500); line-height: 1.5; }
    .project-channels b { color: var(--gray-700); }
    .project-subtitle {
      font-size: 13px; font-weight: 700; color: var(--gray-700);
      margin: 16px 0 10px; display: flex; align-items: center; gap: 8px;
      line-height: 16px;
    }
    .project-subtitle:first-child { margin-top: 0; }
    .project-subtitle::before { content: ''; width: 4px; height: 14px; border-radius: 2px; background: var(--green-600); }
    .project-subtitle.pending::before { background: var(--gray-300); }
    .project-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .pending-grid { grid-template-columns: 1fr; }
    .project-card { border-radius: 12px; border: 1px solid var(--gray-100); padding: 18px; cursor: pointer; transition: .2s; position: relative; overflow: hidden; background: var(--white); }
    .project-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
    .project-card.span-all { grid-column: 1 / -1; }
    .project-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
    .project-card.p1::before { background: var(--red); } .project-card.p2::before { background: var(--amber); } .project-card.p3::before { background: var(--blue); }
    .project-card.p1 { background: linear-gradient(180deg, #fff5f3 0%, #ffecea 100%); box-shadow: 0 0 0 1.5px rgba(239,68,68,.45), 0 0 22px rgba(239,68,68,.28); }
    .project-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .project-title { font-size: 19px; font-weight: 900; color: #1a0d08; letter-spacing: -.2px; }
    .project-meta { font-size: 12px; color: var(--gray-500); margin-top: 4px; }
    .project-priority { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--gray-100); color: var(--gray-700); }
    .project-card.p1 .project-priority { background: #fee2e2; color: #991b1b; }
    .project-card.p2 .project-priority { background: #ffedd5; color: #9a3412; }
    .project-card.p3 .project-priority { background: #dbeafe; color: #1e40af; }
    .project-rag { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }
    .rag-green { background: #22c55e; } .rag-yellow { background: var(--amber); } .rag-red { background: var(--red); box-shadow: 0 0 0 3px rgba(239,68,68,.3); animation: pulseRed 1.6s ease-in-out infinite; }
    .project-kpis { display: flex; gap: 16px; margin: 14px 0 10px; }
    .project-kpi { flex: 1; }
    .project-kpi-label { font-size: 11px; color: var(--gray-500); }
    .project-kpi-value { font-size: 24px; font-weight: 900; color: var(--green-700); letter-spacing: -.5px; }
    .project-kpi-value.small { font-size: 14px; }
    .project-progress { margin-top: 12px; }
    .progress-bar-bg { height: 8px; background: var(--gray-100); border-radius: 999px; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 999px; background: var(--flame); box-shadow: 0 0 14px rgba(255,90,40,.55); animation: pulseGlow 1.6s ease-in-out infinite; }
    .progress-label { font-size: 12px; color: var(--gray-500); margin-top: 6px; }
    .subprojects { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--gray-200); display: none; }
    .subprojects.open { display: block; }
    .subproject { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; font-size: 13px; border-bottom: 1px solid var(--gray-50); }
    .subproject:last-child { border-bottom: none; }
    .subproject-name { color: var(--gray-700); }
    .subproject-owner { color: var(--gray-500); font-size: 11px; }
    .subproject-bar-wrap { width: 80px; }
    .subproject-bar { height: 5px; background: var(--gray-100); border-radius: 999px; overflow: hidden; }
    .subproject-bar-fill { height: 100%; background: var(--flame); border-radius: 999px; }
    .expand-hint { font-size: 12px; color: #c0392b; font-weight: 700; margin-top: 10px; }
    .projects-page { display: flex; flex-direction: column; height: 100%; gap: 14px; }
    .kpi-band { display: flex; gap: 14px; background: var(--flame-deep); color: #fff; border-radius: 14px; padding: 18px 24px; box-shadow: 0 10px 34px rgba(180,30,20,.42), inset 0 1px 0 rgba(255,255,255,.14); border: 1px solid rgba(255,120,80,.4); }
    .kpi-item { flex: 1; position: relative; }
    .kpi-label { font-size: 12px; opacity: 0.88; font-weight: 600; letter-spacing: .3px; }
    .kpi-big { font-size: 38px; font-weight: 900; line-height: 1.08; margin-top: 6px; text-shadow: 0 0 18px rgba(255,255,255,.3); letter-spacing: -1px; }
    .kpi-unit { font-size: 15px; font-weight: 700; opacity: 0.9; }
    .kpi-sub { font-size: 14px; font-weight: 700; opacity: 0.9; }
    .kpi-bar { height: 9px; background: rgba(255,255,255,0.18); border-radius: 999px; overflow: hidden; margin-top: 12px; box-shadow: inset 0 1px 3px rgba(0,0,0,.3); }
    .kpi-bar-fill { height: 100%; background: var(--gold-grad); border-radius: 999px; box-shadow: var(--glow-gold); }
    .kpi-band .kpi-item:nth-child(2), .kpi-band .kpi-item:nth-child(3) { padding-left: 16px; border-left: 1px solid rgba(255,255,255,.2); }
    .kpi-band .kpi-item:nth-child(2) .kpi-big, .kpi-band .kpi-item:nth-child(3) .kpi-big { color: var(--gold-400); text-shadow: 0 0 20px rgba(255,200,40,.75); font-size: 42px; }

    /* Orders rail (right column, vertical marquee) */
    .orders-rail {
      background: linear-gradient(180deg, #fff6ef 0%, #ffecdc 100%);
      border: 1px solid #ffc6a3; border-radius: 14px;
      display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--glow-fire);
      margin-top: 26px; align-self: stretch;
    }
    .orders-rail-header {
      padding: 11px 14px; font-size: 13px; font-weight: 800; color: #fff;
      border-bottom: 1px solid #ffc6a3; display: flex; align-items: center; gap: 8px;
      background: var(--flame); letter-spacing: .5px;
    }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 0 rgba(255,255,255,.8); animation: livePulse 1.4s infinite; }
    .orders-rail-window { flex: 1; overflow: hidden; position: relative; -webkit-mask-image: linear-gradient(180deg, transparent, #000 10%, #000 88%, transparent); mask-image: linear-gradient(180deg, transparent, #000 10%, #000 88%, transparent); }
    .orders-rail-track { will-change: transform; animation: scrollUp 22s linear infinite; }
    .orders-rail-window:hover .orders-rail-track { animation-play-state: paused; }
    @keyframes scrollUp { from { transform: translateY(0); } to { transform: translateY(-50%); } }
    @keyframes pulseGlow { 0%,100% { box-shadow: 0 0 12px rgba(255,90,40,.35); } 50% { box-shadow: 0 0 20px rgba(255,90,40,.6); } }
    @keyframes pulseRed { 0%,100% { box-shadow: 0 0 0 4px rgba(239,68,68,.35); } 50% { box-shadow: 0 0 0 9px rgba(239,68,68,.10); } }
    @keyframes livePulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.7); } 70% { box-shadow: 0 0 0 7px rgba(255,255,255,0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } }
    .order-item { padding: 12px 14px 12px 18px; border-bottom: 1px dashed #ffd9bf; position: relative; }
    .order-item::before { content: ''; position: absolute; left: 6px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--gold-grad); }
    .order-time { font-size: 15px; font-weight: 800; color: #c0392b; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(192,57,43,.25); }
    .order-product { font-size: 13px; color: #7a2e12; margin-top: 3px; line-height: 1.4; font-weight: 600; }
    .order-member { font-size: 11px; color: #a8461f; margin-top: 5px; }
    .order-member::before { content: '👤 '; }

    .focus-timeline { display: flex; flex-direction: column; gap: 16px; }
    .focus-row { display: grid; grid-template-columns: 180px 1fr; gap: 18px; align-items: center; padding: 16px; border-radius: 10px; background: var(--gray-50); }
    .focus-project { font-weight: 700; font-size: 14px; }
    .focus-flow { display: flex; align-items: center; gap: 8px; }
    .focus-stage { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; background: var(--white); color: var(--gray-700); border: 1px solid var(--gray-200); white-space: nowrap; }
    .focus-stage.current { background: linear-gradient(135deg,#fff0e6,#ffe0cc); color: #c0392b; border-color: #ffb98a; font-weight: 700; box-shadow: 0 0 12px rgba(255,107,53,.25); }
    .focus-arrow { color: var(--gray-400); font-size: 14px; }
    .focus-text { font-size: 13px; color: var(--gray-700); margin-top: 8px; line-height: 1.5; }
    .weekly-page { display: flex; flex-direction: column; height: 100%; gap: 16px; }
    .weekly-top { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; flex: 1; min-height: 0; }
    .weekly-panel { display: flex; flex-direction: column; min-height: 0; background: #fcfdfc; border: 1px solid var(--gray-100); border-radius: 12px; padding: 6px 8px; }
    .weekly-panel .project-subtitle { margin-top: 10px; }
    .weekly-scroll { flex: 1; min-height: 0; overflow: auto; padding: 4px 8px 8px; }
    .weekly-bottom { flex: 0 0 auto; }
    .project-subtitle.alert::before { background: var(--red); }
    .milestone-list { display: flex; flex-direction: column; gap: 10px; }
    .timeline-list { display: flex; flex-direction: column; gap: 16px; }
    .tl-group-head { font-size: 14px; font-weight: 800; color: #b91c1c; display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px dashed #ffd2b8; }
    .tl-range { font-size: 11px; font-weight: 400; color: var(--gray-500); }
    .milestone { display: flex; gap: 14px; align-items: flex-start; padding: 10px 12px; background: linear-gradient(180deg,#fffaf6,#fff2ea); border: 1px solid #ffe6d6; border-radius: 10px; }
    .milestone-date { font-weight: 800; color: #c0392b; font-size: 13px; white-space: nowrap; width: 60px; }
    .milestone-body { font-size: 13px; color: var(--gray-700); }
    .milestone-proj { font-size: 11px; color: var(--gray-500); margin-top: 3px; }
    .escalate-list { display: flex; flex-direction: column; gap: 10px; }
    .escalate { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--gray-50); border-left: 4px solid var(--gray-300); }
    .escalate.red { border-left-color: var(--red); background: linear-gradient(90deg, #fff0ef 0%, var(--gray-50) 70%); box-shadow: 0 0 16px rgba(239,68,68,.22); }
    .escalate.yellow { border-left-color: var(--amber); }
    .escalate-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
    .escalate.red .escalate-dot { background: var(--red); box-shadow: 0 0 0 3px rgba(239,68,68,.3); animation: pulseRed 1.2s ease-in-out infinite; }
    .escalate.yellow .escalate-dot { background: var(--amber); }
    .escalate-text { font-size: 13px; color: #1a0d08; font-weight: 800; }
    .escalate-proj { font-size: 11px; color: var(--gray-500); margin-top: 2px; }
    .health-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .health-card { background: var(--gray-50); border-radius: 12px; padding: 18px; }
    .health-card-title { font-size: 14px; font-weight: 700; color: var(--gray-900); margin-bottom: 14px; }
    .bar-chart { display: flex; flex-direction: column; gap: 10px; }
    .bar-item { display: flex; align-items: center; gap: 10px; font-size: 12px; }
    .bar-label { width: 60px; color: var(--gray-700); white-space: nowrap; }
    .bar-track { flex: 1; height: 10px; background: var(--white); border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; }
    .bar-value { width: 30px; text-align: right; color: var(--gray-500); }
    /* Section 4: 资源与决策 */
    .rd-page { display: flex; flex-direction: column; gap: 16px; height: 100%; }
    .rd-hero { background: var(--flame-deep); border-radius: 14px; padding: 18px 22px; color: #fff; box-shadow: 0 8px 26px rgba(220,60,30,.25); }
    .rd-hero-head { font-size: 13px; opacity: .85; margin-bottom: 12px; }
    .rd-hero-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .rd-hero-card { background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; padding: 14px 16px; }
    .rd-hero-num { font-size: 12px; opacity: .7; }
    .rd-hero-name { font-size: 15px; font-weight: 700; margin: 6px 0 4px; }
    .rd-hero-desc { font-size: 12px; opacity: .85; line-height: 1.5; }
    .rd-bottom { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 16px; flex: 1; min-height: 0; }

              <div class="people-hero">
                <div class="people-metric-label">现有 · 累计</div>
                <div class="people-metric-value ${missing ? 'missing' : ''}">${missing ? '待填' : p.current}</div>
              </div>
              <div class="people-deltas">
                <div class="people-delta"><div class="people-delta-label">本周新增</div><div class="people-delta-val ${p.weekAdd === null ? 'zero' : ''}">${p.weekAdd === null ? '待填' : '+' + fmtNum(p.weekAdd)}</div></div>
                <div class="people-delta"><div class="people-delta-label">本月新增</div><div class="people-delta-val ${p.monthAdd === null ? 'zero' : ''}">${p.monthAdd === null ? '待填' : '+' + fmtNum(p.monthAdd)}</div></div>
              </div>
            </div>
            <div class="people-channels"><div class="people-channel-title">本周新增渠道</div><div class="channel-tags">${weekChannels}</div></div>
            <div class="people-channels"><div class="people-channel-title">本月新增渠道</div><div class="channel-tags">${monthChannels}</div></div>
            ${p.target ? `<div class="note" style="margin-top:10px;padding:6px 10px;font-size:11px">目标：${p.target} 人</div>` : ''}
          </div>`;
      }).join('');

      const weekPie = makeDonut(DATA.people.items.map(p => ({
        label: p.name, value: p.weekGMV || 0, color: p.id === 'sidong' ? '#e23744' : p.id === 'partner' ? '#ff6b35' : p.id === 'newbiz' ? '#ff8c66' : '#ffb020'
      })), '本周');
      const monthPie = makeDonut(DATA.people.items.map(p => ({
        label: p.name, value: p.monthGMV || 0, color: p.id === 'sidong' ? '#e23744' : p.id === 'partner' ? '#ff6b35' : p.id === 'newbiz' ? '#ff8c66' : '#ffb020'
      })), '本月');

      const body = `
        <div class="people-layout">
          <div class="people-grid">${cards}</div>
          <div class="people-charts">
            <div class="chart-card"><div class="chart-title">本周 GMV 分布</div>${weekPie.svg}<div class="legend">${weekPie.legend}</div></div>
            <div class="chart-card"><div class="chart-title">本月 GMV 分布</div>${monthPie.svg}<div class="legend">${monthPie.legend}</div></div>
          </div>
        </div>
        <div class="note missing-note">${DATA.people.note}</div>
      `;
      return section('people', '项目人数', body);
    }

    function isProjectRunning(p) {
      if (p.progress && p.progress > 0) return true;
      if (p.stage && (p.stage.includes('销售') || p.stage.includes('交付') || p.stage.includes('测试') || p.stage.includes('已启动'))) return true;
      return false;
    }

    function projectCard(p, spanAll) {
      const progress = p.progress || 0;
      const progressText = p.progress ? `${p.progress}%` : '待启动';
      const revDone = p.revenueDone !== null ? `${p.revenueDone}万` : '—';
      const revTarget = p.revenueTarget !== null ? `${p.revenueTarget}万` : '非直接营收';
      const subRows = p.subProjects.map(s => `
        <div class="subproject"><div><div class="subproject-name">${s.name}</div><div class="subproject-owner">${s.owner} · ${s.status}</div></div><div class="subproject-bar-wrap"><div class="subproject-bar"><div class="subproject-bar-fill" style="width:${s.progress}%"></div></div></div></div>`).join('');
      return `
        <div class="project-card ${p.priority.toLowerCase()} ${spanAll ? 'span-all' : ''}" onclick="toggleSub('${p.id}')">
          <div class="project-top"><div><div class="project-title">${p.icon} ${p.name}</div><div class="project-meta">负责人 ${p.owner} · 操盘手 ${p.operator} · ${p.period}</div></div><div style="display:flex;align-items:center;gap:10px"><span class="project-priority">${p.priority}</span><div class="project-rag rag-${p.flag}"></div></div></div>
          <div class="project-kpis"><div class="project-kpi"><div class="project-kpi-label">本月目标营收</div><div class="project-kpi-value">${revTarget}</div></div><div class="project-kpi"><div class="project-kpi-label">已完成</div><div class="project-kpi-value">${revDone}</div></div><div class="project-kpi"><div class="project-kpi-label">状态</div><div class="project-kpi-value small">${p.flagText}</div></div></div>
          <div class="project-progress"><div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${progress}%"></div></div><div class="progress-label">项目进度：${progressText}</div></div>
          <div class="project-extra">
            ${p.positioning ? `<div class="project-positioning">📍 ${p.positioning}</div>` : ''}
            ${p.metrics && p.metrics.length ? `<div class="project-metrics">${p.metrics.map(m => `<span class="metric-chip">${m}</span>`).join('')}</div>` : ''}
            ${p.channels && p.channels.length ? `<div class="project-channels"><b>渠道分工：</b>${p.channels.map(c => `${c.src} ${c.owner}`).join(' · ')}</div>` : ''}
          </div>
          <div class="expand-hint">点击展开 4 个小项目 ▼</div><div class="subprojects" id="sub-${p.id}">${subRows}</div>
        </div>`;
    }

    // 小鹅通实时出单接口地址（留空 = 使用下方占位示例；接入 Worker 后填入其 /orders 地址）
    const ORDERS_API = '';

    function startOrderFeed() {
      if (!ORDERS_API) return;
      const track = () => document.querySelector('.orders-rail-track');
      async function update() {
        try {
          const res = await fetch(ORDERS_API, { cache: 'no-store' });
          if (!res.ok) return;
          const list = await res.json();
          if (!Array.isArray(list) || !list.length) return;
          const html = list.map(orderItemHTML).join('');
          const t = track();
          if (t) t.innerHTML = html + html; // 复制一份保证滚动无缝
        } catch (e) { /* 网络异常时保留占位示例，不影响其他板块 */ }
      }
      update();
      setInterval(update, 30000); // 每 30 秒刷新一次
    }

    function orderItemHTML(o) {
      const amt = (o.amount != null && o.amount !== '' && o.amount !== 0) ? ` <span style="color:#ffb020;font-size:11px;margin-left:4px">¥${o.amount}</span>` : '';
      return `<div class="order-item"><div class="order-time">${o.time}</div><div class="order-product">${o.product}${amt}</div><div class="order-member">${o.member}${o.channel && o.channel !== '—' ? ' · ' + o.channel : ''}</div></div>`;
    }

    function renderOrders() {
      const one = DATA.orders.map(orderItemHTML).join('');
      return `
        <div class="orders-rail">
          <div class="orders-rail-header">🔥 实时出单<span class="live-dot"></span>LIVE</div>
          <div class="orders-rail-window"><div class="orders-rail-track">${one}${one}</div></div>
        </div>`;
    }

    function renderRevenueComposition() {
      const colors = { book: '#e23744', consult: '#ff6b35', training: '#ffb020', hangzhou: '#ff8c66' };
      const bd = DATA.monthlyRevenue.breakdown;
      const targetData = bd.map(d => ({label: d.name, value: d.target, color: colors[d.id] || '#94a3b8'}));
      const doneData = bd.map(d => ({label: d.name, value: d.done || 0, color: colors[d.id] || '#94a3b8'}));
      const targetDonut = makeDonut(targetData, '目标');
      const doneDonut = makeDonut(doneData, '已收');
      const pct = Math.round((DATA.monthlyRevenue.done / DATA.monthlyRevenue.target) * 100);
      return `
        <div class="projects-comp">
          <div class="comp-card">
            <div class="comp-title">🎯 8月目标 GMV 构成</div>
            ${targetDonut.svg}
            <div class="legend">${targetDonut.legend}</div>
          </div>
          <div class="comp-card">
            <div class="comp-title">✅ 当前已完成构成</div>
            ${doneDonut.svg}
            <div class="legend">${doneDonut.legend}</div>
            <div class="comp-note">整体完成率 ${pct}%（${DATA.monthlyRevenue.done}万 / ${DATA.monthlyRevenue.target}万）</div>
          </div>
        </div>`;
    }

    function renderProjects() {
      const all = [...DATA.projects].sort((a, b) => {
        const ar = isProjectRunning(a), br = isProjectRunning(b);
        if (ar && !br) return -1;
        if (!ar && br) return 1;
        const order = {P1:1, P2:2, P3:3};
        return order[a.priority] - order[b.priority];
      });
      const running = all.filter(isProjectRunning).sort((a, b) => (b.revenueTarget || 0) - (a.revenueTarget || 0));
      const pending = all.filter(p => !isProjectRunning(p));

      const runningCards = running.map((p, i) => projectCard(p, running.length === 3 && i === 0));
      const pendingCards = pending.map(p => projectCard(p, false));

      const target = DATA.monthlyRevenue.target, done = DATA.monthlyRevenue.done;
      const pct = Math.round(done / target * 100);
      const kpiBand = `
        <div class="kpi-band">
          <div class="kpi-item"><div class="kpi-label">8月营收目标</div><div class="kpi-big">${target}<span class="kpi-unit">万</span></div></div>
          <div class="kpi-item"><div class="kpi-label">当前已收款</div><div class="kpi-big">${done}<span class="kpi-unit">万</span> <span class="kpi-sub">/ ${target}万</span></div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:${pct}%"></div></div></div>
          <div class="kpi-item"><div class="kpi-label">整体完成率</div><div class="kpi-big">${pct}<span class="kpi-unit">%</span></div></div>
          <div class="kpi-item"><div class="kpi-label">在跑项目</div><div class="kpi-big">${running.length}<span class="kpi-unit">/${all.length}</span></div></div>
        </div>`;

      const left = `
        <div class="project-subtitle">进行中项目 · ${running.length} 个</div>
        <div class="project-grid">${runningCards.join('')}</div>
        ${pending.length ? `<div class="project-subtitle pending">待启动项目 · ${pending.length} 个</div><div class="project-grid pending-grid">${pendingCards.join('')}</div>` : ''}`;

      const body = `<div class="projects-page">${kpiBand}<div class="projects-layout"><div class="projects-left">${left}</div>${renderRevenueComposition()}${renderOrders()}</div></div>`;
      return section('projects', '本月项目', body);
    }

    function renderWeekly() {
      const dynRows = DATA.weeklyProgress.map(w => {
        const p = DATA.projects.find(x => x.id === w.id);
        return `<div class="focus-row"><div class="focus-project">${p.icon} ${p.name} <span style="font-weight:400;color:#6b7280">· ${p.owner}</span></div><div><div class="focus-flow"><div class="focus-stage">${w.lastWeekStage}</div><div class="focus-arrow">→</div><div class="focus-stage current">${w.thisWeekStage}</div><div class="focus-arrow">→</div><div class="focus-stage">${w.nextWeekStage}</div></div><div class="focus-text"><strong>本周重点：</strong>${w.thisWeekFocus}</div></div></div>`;
      }).join('');

      const tlGroups = (DATA.timeline || []).map(g => {
        const items = g.items.map(m => `<div class="milestone"><div class="milestone-date">${m.date}</div><div><div class="milestone-body">${m.text}</div><div class="milestone-proj">${m.project}</div></div></div>`).join('');
        return `<div class="tl-group"><div class="tl-group-head">${g.group}<span class="tl-range">${g.range}</span></div>${items}</div>`;
      }).join('');

      const body = `<div class="weekly-page">
        <div class="weekly-top">
          <div class="weekly-panel"><div class="project-subtitle">关键节点时间轴（8–9月）</div><div class="weekly-scroll timeline-list">${tlGroups}</div></div>
          <div class="weekly-panel"><div class="project-subtitle">本周项目动态</div><div class="weekly-scroll focus-timeline">${dynRows}</div></div>
        </div>
      </div>`;
      return section('weekly', '本周的重点', body);
    }

    function renderRD() {
      const hero = `
        <div class="rd-hero">
          <div class="rd-hero-head">🎯 8-9月 三大作战方向（阶段经营核心）<div class="rd-hero-sub" style="font-size:13px;font-weight:500;opacity:.9;margin-top:6px">｜ 阶段基准：月营收 <b>30万</b> ・ 利润率 <b>30-40%</b> ｜ 8月目标 <b>28万</b> ・ 8-9月合计 <b>100万</b>（深圳大会8月中旬启动）</div></div>
          <div class="rd-hero-cards">
            ${DATA.rd.directions.map((d, i) => `
              <div class="rd-hero-card">
                <div class="rd-hero-num">方向 0${i+1}</div>
                <div class="rd-hero-name">${d.name}</div>
                <div class="rd-hero-desc">${d.desc}</div>
              </div>`).join('')}
          </div>
        </div>`;

      const matrixInner = `
        <div class="rd-matrix">
          <div class="rd-mrow head"><div>项目</div><div>等级</div><div>核心负责人</div><div>操盘手</div></div>
          ${DATA.projects.map(p => `
            <div class="rd-mrow">
              <div class="rd-mproj">${p.icon} ${p.name}</div>
              <div><span class="rd-mlevel l${p.level}">${p.level}级</span></div>
              <div class="rd-mowner">${p.owner}</div>
              <div class="rd-mop">${p.operator}</div>
            </div>`).join('')}
        </div>`;

      const loadMap = {};
      DATA.projects.forEach(p => {
        [p.owner, p.operator].forEach(n => {
          if (!loadMap[n]) loadMap[n] = [];
          if (!loadMap[n].includes(p.name)) loadMap[n].push(p.name);
        });
      });
      const loadRows = Object.keys(loadMap).map(name => {
        const projs = loadMap[name], cnt = projs.length;
        const st = cnt >= 4 ? 'over' : cnt >= 3 ? 'high' : 'normal';
        const label = st === 'over' ? '过载' : st === 'high' ? '偏高' : '正常';
        return `<div class="rd-load-row"><div class="rd-load-avatar">${name[0]}</div><div class="rd-load-info"><div class="rd-load-name">${name}<span class="rd-load-tag ${st}">${label}</span></div><div class="rd-load-projs">${projs.join(' · ')}</div></div><div class="rd-load-count ${st}">${cnt}</div></div>`;
      }).join('');

      const budgetRows = DATA.rd.budget.map(b => `
        <div class="rd-budget-row ${b.risk}"><div class="rd-budget-proj">${b.project}<span class="rd-budget-risk ${b.risk}">${b.risk === 'high' ? '高风险' : b.risk === 'medium' ? '中风险' : '低风险'}</span></div><div class="rd-budget-status">${b.status}</div></div>`).join('');

      const bottom = `
        <div class="rd-bottom">
          <div class="rd-panel"><div class="rd-panel-title">负责人 · 操盘手矩阵</div><div class="rd-scroll">${matrixInner}</div></div>
          <div class="rd-panel"><div class="rd-panel-title">人力 · 精力负载</div><div class="rd-scroll"><div class="rd-load">${loadRows}</div></div></div>
          <div class="rd-panel"><div class="rd-panel-title">成本预算状态</div><div class="rd-scroll"><div class="rd-budget">${budgetRows}</div></div></div>
        </div>`;

      const body = `<div class="rd-page">${hero}${bottom}</div>`;
      return section('rd', '资源与决策', body);
    }

    function section(tabId, title, body) {
      const hidden = tabId === 'people' ? '' : ' hidden';
      return `<div class="section tab-panel${hidden}" id="tab-${tabId}" aria-label="${title}"><div class="section-body">${body}</div></div>`;
    }

    function makePie(data) {
      const total = data.reduce((a, b) => a + b.value, 0) || 1;
      let acc = 0;
      const slices = data.map(d => {
        const start = acc / total * Math.PI * 2; acc += d.value;
        const end = acc / total * Math.PI * 2;
        const x1 = 50 + 40 * Math.cos(start), y1 = 50 + 40 * Math.sin(start);
        const x2 = 50 + 40 * Math.cos(end), y2 = 50 + 40 * Math.sin(end);
        const large = end - start > Math.PI ? 1 : 0;
        return `<path d="M50,50 L${x1},${y1} A40,40 0 ${large},1 ${x2},${y2} Z" fill="${d.color}" stroke="#fff" stroke-width="1" />`;
      }).join('');
      const legend = data.map(d => `<div class="legend-item"><div class="legend-dot" style="background:${d.color}"></div>${d.label} ${d.value}</div>`).join('');
      return {svg: `<svg class="pie-chart" viewBox="0 0 100 100">${slices}</svg>`, legend};
    }

    function makeDonut(data, labelPrefix) {
      const total = data.reduce((a, b) => a + b.value, 0) || 1;
      let acc = 0;
      const slices = data.map(d => {
        const start = acc / total * Math.PI * 2; acc += d.value;
        const end = acc / total * Math.PI * 2;
        const x1 = 50 + 40 * Math.cos(start), y1 = 50 + 40 * Math.sin(start);
        const x2 = 50 + 40 * Math.cos(end), y2 = 50 + 40 * Math.sin(end);
        const large = end - start > Math.PI ? 1 : 0;
        return `<path d="M50,50 L${x1},${y1} A40,40 0 ${large},1 ${x2},${y2} Z" fill="${d.color}" stroke="#fff" stroke-width="1" />`;
      }).join('');
      const legend = data.map(d => `<div class="legend-item"><div class="legend-dot" style="background:${d.color}"></div>${d.label} ${d.value ? d.value + '万' : '—'}</div>`).join('');
      const centerText = total > 0 ? `${labelPrefix}<tspan x="50" dy="12">${total}万</tspan>` : '暂无';
      return {svg: `<svg class="pie-chart" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="transparent"/>${slices}<circle cx="50" cy="50" r="24" fill="#f3f4f6"/><text x="50" y="48" class="pie-center">${centerText}</text></svg>`, legend};
    }

    window.showTab = function(id) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
      document.getElementById('tab-' + id).classList.remove('hidden');
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.querySelector('[data-tab="' + id + '"]').classList.add('active');
    };
    window.toggleSub = function(id) { document.getElementById('sub-' + id).classList.toggle('open'); };

    app.innerHTML = renderPeople() + renderProjects() + renderWeekly() + renderRD();
    startOrderFeed();

    document.getElementById('principlesFooter').innerHTML =
      '<div class="pf-title">📌 项目管理原则</div><div class="pf-items">' +
      DATA.principles.map((t, i) => `<span>${'①②③④'[i]} ${t}</span>`).join('') + '</div>';
  </script>
</body>
</html>
