<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>觉醒 · 只工作不上班 | 项目看板</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* 火焰主色（原 green 变量复用为火热橙红，绿=正常 仍用硬编码 #22c55e 保留语义） */
      --green-900: #5c0a0a;
      --green-800: #9b1c1c;
      --green-700: #c0392b;
      --green-600: #ff4d2e;
      --green-500: #ff6b35;
      --green-100: #fff1e8;
      --green-50:  #fdf3ee;
      --amber: #ff8c00;
      --red: #ef4444;
      --blue: #3b82f6;
      --gold-500: #ffb020;
      --gold-400: #ffd60a;
      --flame: linear-gradient(135deg, #ff4d2e 0%, #ff8c00 100%);
      --flame-deep: linear-gradient(135deg, #4a0808 0%, #e2371f 100%);
      --gold-grad: linear-gradient(135deg, #ffd60a 0%, #ff8c00 100%);

      --bg: #fdf3ec;
      --radius: 14px;
      --shadow: 0 6px 22px rgba(220, 70, 30, 0.10);
      --shadow-hover: 0 12px 32px rgba(220, 70, 30, 0.18);
      --glow-fire: 0 0 16px rgba(255, 90, 40, 0.45);
      --glow-gold: 0 0 16px rgba(255, 176, 32, 0.5);

    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--gray-900); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .brand { display: flex; align-items: center; gap: 14px; }

    .brand-title { font-size: 18px; font-weight: 700; }
    .brand-sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }
    .update-time { font-size: 13px; opacity: 0.85; }
    .nav-tabs {
      background: var(--white); border-bottom: 1px solid var(--gray-100);
      padding: 0 28px; display: flex; gap: 0; position: sticky; top: 0; z-index: 50;
    }
    .nav-tab {
      padding: 16px 26px; font-size: 15px; font-weight: 500; color: var(--gray-700);
      cursor: pointer; border-bottom: 3px solid transparent; transition: .2s;

    .nav-tab:hover { color: var(--green-700); }
    .nav-tab.active { color: var(--green-600); border-bottom-color: var(--green-600); font-weight: 800; text-shadow: 0 0 12px rgba(255,90,40,.3); }
    .container { padding: 16px 28px 18px; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .section { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .section.hidden { display: none; }
    .section-body { padding: 16px 24px; flex: 1; min-height: 0; overflow: auto; }

    /* Section 1: Products */

    .products-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: stretch; }
    .people-card {

    .people-owner .owner-v { font-size: 19px; font-weight: 900; letter-spacing: -.3px; }
    .people-numbers { display: flex; align-items: baseline; gap: 14px; margin: 14px 0 6px; }

    .people-pct { font-size: 26px; font-weight: 900; letter-spacing: -1px; }

    .people-progress { margin-bottom: 14px; }
    .people-summary { display: flex; gap: 10px; margin: 10px 0 12px; flex-wrap: wrap; }
    .people-summary-item {

    .comp-card { flex: 1; min-height: 0; background: linear-gradient(180deg,#fffaf5,#fff1e8); border: 1px solid #ffe0cc; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: auto; box-shadow: 0 4px 16px rgba(255,107,53,.12); }

    const ORDERS_API = '';

    function startOrderFeed() {
      if (!ORDERS_API) return;
      const track = () => document.querySelector('.orders-rail-track');
      async function update() {
        try {
          const res = await fetch(ORDERS_API, { cache: 'no-store' });
          if (!res.ok) return;
          const list = await res.json();
          if (!Array.isArray(list) || !list.length) return;
          const html = list.map(orderItemHTML).join('');
          const t = track();
          if (t) t.innerHTML = html + html; // 复制一份保证滚动无缝
        } catch (e) { /* 网络异常时保留占位示例，不影响其他板块 */ }
      }
      update();
      setInterval(update, 30000); // 每 30 秒刷新一次
    }

      const kpiBand = `
        <div class="kpi-band v2">
          <div class="kpi-card"><div class="kpi-card-label">8月营收目标</div><div class="kpi-card-value">${target}<span class="unit">万</span></div><div class="kpi-card-sub"><b>书籍 15万</b> / <b>咨询 5万</b> / <b>内训 3万</b> / <b>杭州 5万</b></div></div>
          <div class="kpi-card"><div class="kpi-card-label">当前已收款</div><div class="kpi-card-value">${done}<span class="unit">万</span></div><div class="kpi-card-sub">缺口 <b>${gap} 万</b></div></div>
          <div class="kpi-card"><div class="kpi-card-label">整体完成率</div><div class="kpi-card-value">${pct}<span class="unit">%</span></div><div class="kpi-card-bar"><div class="kpi-card-bar-fill" style="width:${pct}%"></div></div></div>
          <div class="kpi-card"><div class="kpi-card-label">项目动态</div><div class="kpi-card-value">${runningCount}<span class="unit">/${all.length}</span></div><div class="kpi-card-sub">${starText}</div></div>
        </div>`;

      const body = `<div class="projects-page">${kpiBand}<div class="project-grid">${projectCards}</div></div>`;
      return section('projects', '本月项目', body);
    }

    function renderWeekly() {
      const dynRows = DATA.weeklyProgress.map(w => {
        const p = DATA.projects.find(x => x.id === w.id);
        return `<div class="focus-row"><div class="focus-project">${p.icon} ${p.name} <span style="font-weight:400;color:#6b7280">· ${p.owner}</span></div><div><div class="focus-flow"><div class="focus-stage">${w.lastWeekStage}</div><div class="focus-arrow">→</div><div class="focus-stage current">${w.thisWeekStage}</div><div class="focus-arrow">→</div><div class="focus-stage">${w.nextWeekStage}</div></div><div class="focus-text"><strong>本周重点：</strong>${w.thisWeekFocus}</div></div></div>`;
      }).join('');

      const tlGroups = (DATA.timeline || []).map(g => {
        const items = g.items.map(m => `<div class="milestone"><div class="milestone-date">${m.date}</div><div><div class="milestone-body">${m.text}</div><div class="milestone-proj">${m.project}</div></div></div>`).join('');
        return `<div class="tl-group"><div class="tl-group-head">${g.group}<span class="tl-range">${g.range}</span></div>${items}</div>`;
      }).join('');

      const body = `<div class="weekly-page">
        <div class="weekly-top">
          <div class="weekly-panel"><div class="project-subtitle">关键节点时间轴（8–9月）</div><div class="weekly-scroll timeline-list">${tlGroups}</div></div>
          <div class="weekly-panel"><div class="project-subtitle">本周项目动态</div><div class="weekly-scroll focus-timeline">${dynRows}</div></div>
        </div>
      </div>`;
      return section('weekly', '本周的重点', body);
    }

    function renderRD() {
      const hero = `
        <div class="rd-hero">
          <div class="rd-hero-head">🎯 8-9月 三大作战方向（阶段经营核心）<div class="rd-hero-sub" style="font-size:13px;font-weight:500;opacity:.9;margin-top:6px">｜ 阶段基准：月营收 <b>30万</b> ・ 利润率 <b>30-40%</b> ｜ 8月目标 <b>28万</b> ・ 8-9月合计 <b>100万</b>（深圳大会8月中旬启动）</div></div>
          <div class="rd-hero-cards">
            ${DATA.rd.directions.map((d, i) => `
              <div class="rd-hero-card">
                <div class="rd-hero-num">方向 0${i+1}</div>
                <div class="rd-hero-name">${d.name}</div>
                <div class="rd-hero-desc">${d.desc}</div>
              </div>`).join('')}
          </div>
        </div>`;

      const matrixInner = `
          <div class="rd-matrix">
          <div class="rd-mrow head"><div>项目</div><div>等级</div><div>核心负责人</div><div>操盘手</div><div>核心成员</div></div>
          ${DATA.projects.map(p => `
            <div class="rd-mrow">
              <div class="rd-mproj">${p.icon} ${p.name}</div>
              <div><span class="rd-mlevel l${p.level}">${p.level}级</span></div>
              <div class="rd-mowner">${p.owner}</div>
              <div class="rd-mop">${p.operator}</div>
              <div class="rd-mmembers">${p.members && p.members.length ? p.members.join('、') : '—'}</div>
            </div>`).join('')}
        </div>`;

      const loadMap = {};
      DATA.projects.forEach(p => {
        const names = [p.owner, p.operator, ...(p.members || [])];
        names.forEach(n => {
          if (!n || /待补充/.test(n)) return;
          if (!loadMap[n]) loadMap[n] = [];
          if (!loadMap[n].includes(p.name)) loadMap[n].push(p.name);
        });
      });
      const loadRows = Object.keys(loadMap).map(name => {
        const projs = loadMap[name], cnt = projs.length;
        const st = cnt >= 4 ? 'over' : cnt >= 3 ? 'high' : 'normal';
        const label = st === 'over' ? '过载' : st === 'high' ? '偏高' : '正常';
        return `<div class="rd-load-row"><div class="rd-load-avatar">${name[0]}</div><div class="rd-load-info"><div class="rd-load-name">${name}<span class="rd-load-tag ${st}">${label}</span></div><div class="rd-load-projs">${projs.join(' · ')}</div></div><div class="rd-load-count ${st}">${cnt}</div></div>`;
      }).join('');

      const budgetRows = DATA.rd.budget.map(b => `
        <div class="rd-budget-row ${b.risk}"><div class="rd-budget-proj">${b.project}<span class="rd-budget-risk ${b.risk}">${b.risk === 'high' ? '高风险' : b.risk === 'medium' ? '中风险' : '低风险'}</span></div><div class="rd-budget-status">${b.status}</div></div>`).join('');

      const bottom = `
        <div class="rd-bottom">
          <div class="rd-panel"><div class="rd-panel-title">负责人 · 操盘手矩阵</div><div class="rd-scroll">${matrixInner}</div></div>
          <div class="rd-panel"><div class="rd-panel-title">人力 · 精力负载</div><div class="rd-scroll"><div class="rd-load">${loadRows}</div></div></div>
          <div class="rd-panel"><div class="rd-panel-title">成本预算状态</div><div class="rd-scroll"><div class="rd-budget">${budgetRows}</div></div></div>
        </div>`;

      const body = `<div class="rd-page">${hero}${bottom}</div>`;
      return section('rd', '资源与决策', body);
    }

    function section(tabId, title, body) {
      const hidden = tabId === 'projects' ? '' : ' hidden';
      return `<div class="section tab-panel${hidden}" id="tab-${tabId}" aria-label="${title}"><div class="section-body">${body}</div></div>`;
    }

    function makePie(data) {
      const total = data.reduce((a, b) => a + b.value, 0) || 1;
      let acc = 0;
      const slices = data.map(d => {
        const start = acc / total * Math.PI * 2; acc += d.value;
        const end = acc / total * Math.PI * 2;
        const x1 = 50 + 40 * Math.cos(start), y1 = 50 + 40 * Math.sin(start);
        const x2 = 50 + 40 * Math.cos(end), y2 = 50 + 40 * Math.sin(end);
        const large = end - start > Math.PI ? 1 : 0;
        return `<path d="M50,50 L${x1},${y1} A40,40 0 ${large},1 ${x2},${y2} Z" fill="${d.color}" stroke="#fff" stroke-width="1" />`;
      }).join('');
      const legend = data.map(d => `<div class="legend-item"><div class="legend-dot" style="background:${d.color}"></div>${d.label} ${d.value}</div>`).join('');
      return {svg: `<svg class="pie-chart" viewBox="0 0 100 100">${slices}</svg>`, legend};
    }

    function makeDonut(data, labelPrefix, unit) {
      unit = unit || '万';
      const total = data.reduce((a, b) => a + b.value, 0) || 1;
      let acc = 0;
      const cx = 60, cy = 60, r = 48, hole = 30;
      const slices = data.map(d => {
        const start = acc / total * Math.PI * 2; acc += d.value;
        const end = acc / total * Math.PI * 2;
        const x1 = cx + r * Math.cos(start), y1 = cy + r * Math.sin(start);
        const x2 = cx + r * Math.cos(end), y2 = cy + r * Math.sin(end);
        const large = end - start > Math.PI ? 1 : 0;
        return `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="${d.color}" stroke="#fff" stroke-width="2" />`;
      }).join('');
      const legend = data.map(d => {
        const pct = total ? Math.round(d.value / total * 100) : 0;
        return `<div class="legend-item"><div class="legend-dot" style="background:${d.color}"></div><span>${d.label} <b>${d.value}${unit}</b> · ${pct}%</span></div>`;
      }).join('');
      const centerLabel = labelPrefix ? `<tspan x="${cx}" dy="-10" font-size="10" opacity="0.7">${labelPrefix}</tspan>` : '';
      const centerText = total > 0 ? `<tspan x="${cx}" dy="${labelPrefix ? 6 : -4}" font-size="16" font-weight="900">${total}</tspan><tspan x="${cx}" dy="15" font-size="10" opacity="0.7">${unit}</tspan>` : '<tspan x="60" dy="4" font-size="12">暂无</tspan>';
      return {svg: `<svg class="pie-chart" viewBox="0 0 120 120"><circle cx="${cx}" cy="${cy}" r="${r}" fill="transparent"/>${slices}<circle cx="${cx}" cy="${cy}" r="${hole}" fill="#fffaf7"/><text x="${cx}" y="${cy}" class="pie-center" text-anchor="middle" dominant-baseline="middle">${centerLabel}${centerText}</text></svg>`, legend};
    }

    window.showTab = function(id) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
      document.getElementById('tab-' + id).classList.remove('hidden');
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.querySelector('[data-tab="' + id + '"]').classList.add('active');
    };
    window.toggleSub = function(id) { document.getElementById('sub-' + id).classList.toggle('open'); };
    if (location.hash) {
      const hashTab = location.hash.slice(1);
      if (document.querySelector('[data-tab="' + hashTab + '"]')) showTab(hashTab);
    }

    app.innerHTML = renderProjects() + renderProducts() + renderWeekly() + renderRD();
    startOrderFeed();

    document.getElementById('principlesFooter').innerHTML =
      '<div class="pf-title">📌 项目管理原则</div><div class="pf-items">' +
      DATA.principles.map((t, i) => `<span>${'①②③④'[i]} ${t}</span>`).join('') + '</div>';
  </script>
</body>
</html>
